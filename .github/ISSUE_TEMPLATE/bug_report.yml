name: Bug report
description: Report a reproducible DevHub defect with sanitized evidence.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve DevHub. Never attach real session histories,
        credentials, private repository paths, or unreviewed diagnostic exports.

  - type: input
    id: version
    attributes:
      label: DevHub version or commit
      description: Use a release version when available, otherwise paste the commit hash.
      placeholder: 0.1.0 or abc1234
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: macOS and Mac architecture
      placeholder: macOS 15.6, Apple Silicon
    validations:
      required: true

  - type: input
    id: tool
    attributes:
      label: Related tool and version
      description: Leave blank if this is not an integration issue.
      placeholder: Claude Code 1.x

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic project names and paths.
      placeholder: |
        1. Register /Users/example/ExampleApp
        2. Open Sessions
        3. Select Refresh
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: sanitized_evidence
    attributes:
      label: Sanitized evidence
      description: Add the smallest useful excerpt or synthetic fixture. Screenshots must contain synthetic data only.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real paths, session content, account details, credentials, and other private data.
          required: true
