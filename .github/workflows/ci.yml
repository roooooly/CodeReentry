name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-privacy:
    name: Repository privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install ripgrep when missing
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: Reject private paths, generated data, and credential shapes
        run: ./scripts/privacy-audit.sh
      - name: Test the privacy-safe re-entry recorder
        run: ./scripts/test-reentry-trial.sh

  macos-tests:
    name: macOS tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify the one-command source build from the committed project
        run: ./scripts/run-source.sh --build-only
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: xcodegen generate
      - name: Test DevHubCore
        run: swift test --package-path DevHubPackage
      - name: Test synthetic performance fixtures
        run: ./scripts/test-performance-fixture.sh
      - name: Test performance budget summaries
        run: ./scripts/test-performance-summary.sh
      - name: Test the app in English without signing
        run: >-
          xcodebuild
          -project DevHub.xcodeproj
          -scheme DevHub
          -destination 'platform=macOS'
          -testLanguage en
          -testRegion US
          -skip-testing:DevHubTests/GallerySnapshotTests
          -skip-testing:DevHubTests/ProjectDetailSnapshotTests
          test CODE_SIGNING_ALLOWED=NO
      - name: Test the app in Simplified Chinese without signing
        run: >-
          xcodebuild
          -project DevHub.xcodeproj
          -scheme DevHub
          -destination 'platform=macOS'
          -testLanguage zh-Hans
          -testRegion CN
          -skip-testing:DevHubTests/GallerySnapshotTests
          -skip-testing:DevHubTests/ProjectDetailSnapshotTests
          test CODE_SIGNING_ALLOWED=NO
